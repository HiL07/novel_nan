# =====================================================================
# nginx site config for the nan_novel frontend container
# 前端容器的 nginx 站点配置
#
# Routing / 路由规则:
#   /java/api/...  ->  backend:8022/api/...   (Spring Boot file service)
#                      Java 文件管理后端（前缀 /java 被剥离）
#   /ai/api/...    ->  python:8021/api/...    (FastAPI AI service)
#                      Python AI 服务（前缀 /ai 被剥离）
#   /              ->  static Vue SPA (history mode fallback)
#                      Vue 单页静态资源（history 路由回退）
#
# The prefixes are baked into the frontend at build time via
# VITE_API_BASE_URL=/java and VITE_AI_BASE_URL=/ai.
# 两个前缀在前端构建时通过 VITE_API_BASE_URL=/java、
# VITE_AI_BASE_URL=/ai 固化。
# =====================================================================

upstream nan_backend {
    # Spring Boot container / Spring Boot 容器
    server backend:8022;
    keepalive 16;
}

upstream nan_python {
    # FastAPI container / FastAPI 容器
    server python:8021;
    keepalive 16;
}

server {
    listen       80;
    server_name  _;

    # Charset for any text responses / 文本响应字符集
    charset utf-8;

    # Max upload size must match spring.servlet.multipart (50MB).
    # 上传大小上限需与后端 multipart 配置一致（50MB）。
    client_max_body_size 50m;

    # ---------------------------------------------------------------
    # Java backend: strip the "/java" prefix.
    # Java 后端：剥离 /java 前缀（proxy_pass 末尾带 /）。
    # ---------------------------------------------------------------
    location /java/ {
        proxy_pass         http://nan_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # File download/preview may be large; don't buffer it all.
        # 文件下载/预览可能较大，关闭缓冲边收边发。
        proxy_buffering off;
    }

    # ---------------------------------------------------------------
    # Python AI service: strip the "/ai" prefix.
    # Python AI 服务：剥离 /ai 前缀。
    # Longer read timeout: model loading / generation can take minutes.
    # 读超时放宽：模型加载与生成可能耗时数分钟。
    # ---------------------------------------------------------------
    location /ai/ {
        proxy_pass         http://nan_python/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------
    # Static SPA assets / Vue 单页静态资源
    # ---------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Long cache for hashed assets; never cache index.html.
        # 带哈希的静态资源长缓存；index.html 不缓存。
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
