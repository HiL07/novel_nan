# =====================================================================
# nan_novel — Docker Compose stack
# 小说生成系统一键编排：Spring Boot（SQLite）+ FastAPI + Nginx(Vue)，共享数据卷 /data
#
# Usage / 使用方式（在本 docker/ 目录内执行）:
#   cp .env.example .env        # first time only / 仅首次
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Variables are read from docker/.env / 变量从 docker/.env 读取
# (see .env.example; no real secrets are stored here).
# =====================================================================

name: nan-novel

services:
  # -----------------------------------------------------------------
  # Spring Boot backend (file-management base framework)
  # Spring Boot 后端（文件管理基础框架）
  # -----------------------------------------------------------------
  backend:
    build:
      # Build context is the repository root so the Dockerfile can COPY
      # backend/ and (for other images) frontend/ and python-service/.
      # 构建上下文为仓库根目录，Dockerfile 才能 COPY 各子项目。
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: nan-novel-backend:latest
    container_name: nan-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # --- Shared data dir: SQLite (nan_novel.db), upload/, extract-results/ ---
      # --- 共享数据目录：SQLite 库、上传文件、提取结果（见 data/README.md）---
      DATA_DIR: /data
      # --- Python AI service address on the Docker network / Docker 网络内的 Python 服务地址 ---
      AI_SERVICE_URL: http://python:8021
      # --- Optional default remote-LLM key / 可选：默认远程大模型 Key ---
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      # Shared with the python service / 与 python 服务共享
      - app-data:/data
    # No host port by default: reach it through nginx (/java/...).
    # Uncomment to debug directly from the host.
    # 默认不映射宿主机端口，经 nginx（/java/...）访问；调试时可取消注释。
    # ports:
    #   - "8022:8022"
    networks:
      - app-net

  # -----------------------------------------------------------------
  # FastAPI Python AI service (text extraction + remote LLM client)
  # FastAPI Python AI 服务（文本提取 + 远程大模型客户端）
  # No GPU / CUDA is required or configured in this stack.
  # 本编排不需要、也不配置任何 GPU / CUDA。
  # -----------------------------------------------------------------
  python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    image: nan-novel-python:latest
    container_name: nan-python
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      # Python fetches source files from Java over the Docker network.
      # Python 经 Docker 网络从 Java 后端拉取源文件。
      JAVA_BACKEND_URL: http://backend:8022
      # Shared data dir (writes novels/ only) / 共享数据目录（只写 novels/）
      DATA_DIR: /data
      # Base models / LoRA adapters / jobs keep their own volume (unchanged path).
      # 基础模型 / LoRA 适配器 / 任务仍使用独立的模型卷（路径不变）。
      LOCAL_MODELS_DIR: /data/models
    volumes:
      - app-data:/data
      # Mounted over /data/models inside the shared volume / 叠加挂载在共享卷的 models 子目录上
      - models-data:/data/models
    # No host port by default: reach it through nginx (/ai/...).
    # 默认不映射宿主机端口，经 nginx（/ai/...）访问；调试时可取消注释。
    # ports:
    #   - "8021:8021"
    networks:
      - app-net

  # -----------------------------------------------------------------
  # Frontend: Vue static files + reverse proxy (nginx)
  # 前端：Vue 静态文件 + 反向代理（nginx）
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Same-origin prefixes; nginx strips them (see nginx/default.conf).
        # 同源前缀，由 nginx 转发时剥离（见 nginx/default.conf）。
        VITE_API_BASE_URL: /java
        VITE_AI_BASE_URL: /ai
    image: nan-novel-frontend:latest
    container_name: nan-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      python:
        condition: service_started
    ports:
      # The single entry point of the whole stack.
      # 整个系统的唯一对外入口。
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app-net

# -----------------------------------------------------------------
# Persistent named volumes / 持久化命名数据卷
# -----------------------------------------------------------------
# The former nan-mysql-data / nan-upload-data / nan-novels-data volumes are no
# longer declared; existing ones are NOT deleted automatically (remove manually if unused).
# 原 nan-mysql-data / nan-upload-data / nan-novels-data 卷已不再声明；已存在的不会被自动删除，确认无用后可手动删除。
volumes:
  app-data:
    name: nan-data
  models-data:
    name: nan-models-data

networks:
  app-net:
    name: nan-app-net
    driver: bridge
