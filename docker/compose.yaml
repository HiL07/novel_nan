# =====================================================================
# nan_novel — Docker Compose stack
# 小说生成系统一键编排：MySQL + Spring Boot + FastAPI + Nginx(Vue)
#
# Usage / 使用方式（在本 docker/ 目录内执行）:
#   cp .env.example .env        # first time only / 仅首次
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Variables are read from docker/.env / 变量从 docker/.env 读取
# (see .env.example; no real secrets are stored here).
# =====================================================================

name: nan-novel

services:
  # -----------------------------------------------------------------
  # MySQL 8 database / MySQL 8 数据库
  # -----------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: nan-mysql
    restart: unless-stopped
    environment:
      # Root password + database name come from .env (no hardcoded secret).
      # root 密码与库名来自 .env（本文件不写死任何密码）。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test10000}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      # Data files persist across rebuilds / 数据文件持久化，重建容器不丢失
      - mysql-data:/var/lib/mysql
    ports:
      # Host port from .env (default 3307 to avoid clashing with a local
      # MySQL on 3306; set 3306 on a clean server). Remove this line to
      # keep the database reachable only inside the Docker network.
      # 宿主机端口取自 .env（默认 3307，避免与本机 3306 的 MySQL 冲突；
      # 干净服务器可改 3306）。删除本行则数据库仅在 Docker 网络内可达。
      - "${MYSQL_PORT:-3307}:3306"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -----------------------------------------------------------------
  # Spring Boot backend (file-management base framework)
  # Spring Boot 后端（文件管理基础框架）
  # -----------------------------------------------------------------
  backend:
    build:
      # Build context is the repository root so the Dockerfile can COPY
      # backend/ and (for other images) frontend/ and python-service/.
      # 构建上下文为仓库根目录，Dockerfile 才能 COPY 各子项目。
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: nan-novel-backend:latest
    container_name: nan-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # --- DB connection (overrides application.yml) / 数据库连接（覆盖 application.yml）---
      SPRING_DATASOURCE_URL: >-
        jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-test10000}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # --- Upload directory (mounted volume) / 上传目录（挂载数据卷）---
      FILE_STORAGE_PATH: /data/upload
      # --- Python AI service address on the Docker network / Docker 网络内的 Python 服务地址 ---
      AI_SERVICE_URL: http://python:8021
      # --- Optional default remote-LLM key / 可选：默认远程大模型 Key ---
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      # Uploaded novels/files persist here / 上传的小说与文件在此持久化
      - upload-data:/data/upload
    # No host port by default: reach it through nginx (/java/...).
    # Uncomment to debug directly from the host.
    # 默认不映射宿主机端口，经 nginx（/java/...）访问；调试时可取消注释。
    # ports:
    #   - "8022:8022"
    networks:
      - app-net

  # -----------------------------------------------------------------
  # FastAPI Python AI service (slim image: extraction + remote LLM)
  # FastAPI Python AI 服务（精简镜像：文本提取 + 远程大模型）
  # GPU training: add compose.gpu.yaml, see README-Docker.md.
  # GPU 训练：叠加 compose.gpu.yaml，见 README-Docker.md。
  # -----------------------------------------------------------------
  python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    image: nan-novel-python:latest
    container_name: nan-python
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      # Python fetches source files from Java over the Docker network.
      # Python 经 Docker 网络从 Java 后端拉取源文件。
      JAVA_BACKEND_URL: http://backend:8022
      # Base models / LoRA adapters / jobs persist in this volume.
      # 基础模型 / LoRA 适配器 / 任务在此数据卷持久化。
      LOCAL_MODELS_DIR: /data/models
    volumes:
      - models-data:/data/models
    # No host port by default: reach it through nginx (/ai/...).
    # 默认不映射宿主机端口，经 nginx（/ai/...）访问；调试时可取消注释。
    # ports:
    #   - "8021:8021"
    networks:
      - app-net

  # -----------------------------------------------------------------
  # Frontend: Vue static files + reverse proxy (nginx)
  # 前端：Vue 静态文件 + 反向代理（nginx）
  # -----------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        # Same-origin prefixes; nginx strips them (see nginx/default.conf).
        # 同源前缀，由 nginx 转发时剥离（见 nginx/default.conf）。
        VITE_API_BASE_URL: /java
        VITE_AI_BASE_URL: /ai
    image: nan-novel-frontend:latest
    container_name: nan-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      python:
        condition: service_started
    ports:
      # The single entry point of the whole stack.
      # 整个系统的唯一对外入口。
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - app-net

# -----------------------------------------------------------------
# Persistent named volumes / 持久化命名数据卷
# -----------------------------------------------------------------
volumes:
  mysql-data:
    name: nan-mysql-data
  upload-data:
    name: nan-upload-data
  models-data:
    name: nan-models-data

networks:
  app-net:
    name: nan-app-net
    driver: bridge
