# =====================================================================
# GPU override for the Python AI service / Python AI 服务的 GPU 覆盖文件
#
# Rebuilds the python service with CUDA PyTorch so local inference and
# LoRA / QLoRA fine-tuning run inside the container.
# 用 CUDA 版 PyTorch 重建 python 服务，使容器内可进行本机推理与
# LoRA/QLoRA 微调。
#
# Prerequisites / 前提:
#   - NVIDIA driver on the host / 宿主机已装 NVIDIA 驱动
#   - Linux: NVIDIA Container Toolkit installed
#           Linux 需安装 NVIDIA Container Toolkit
#   - Windows: Docker Desktop (WSL2 backend) + up-to-date NVIDIA driver
#           Windows 用 Docker Desktop（WSL2 后端）+ 较新的 NVIDIA 驱动
#
# Usage / 用法（在 docker/ 目录内）:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
#   docker compose -f compose.yaml -f compose.gpu.yaml logs -f python
#
# Verify / 验证:
#   页面「本地模型 -> 系统信息」应能看到 GPU 与 CUDA 信息。
#   The app's Local-Model system page should show GPU + CUDA info.
# =====================================================================

services:
  python:
    # Override the image tag so the GPU build is distinguishable.
    # 覆盖镜像标签，便于与精简版区分。
    image: nan-novel-python-gpu:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.python-gpu
    # Expose the host GPU(s) to the container.
    # 将宿主机 GPU 暴露给容器。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
