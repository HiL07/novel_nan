server:
  port: 8022                       # 日常端口；测试用 --server.port=8012

spring:
  # 本机私密配置（如默认模型 API Key），不入库；从 backend/ 或项目根目录启动都能找到
  config:
    import: optional:file:./application-secret.yml,optional:file:./backend/application-secret.yml
  # SQLite：只存元数据；库文件在共享数据目录 ${app.data-dir}/nan_novel.db（app.data-dir 见文末）
  # WAL：读写可并发；busy_timeout：写锁等待 10 秒而不是立即报错
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${app.data-dir}/nan_novel.db?journal_mode=WAL&busy_timeout=10000&synchronous=NORMAL
    hikari:
      maximum-pool-size: 4
      connection-timeout: 30000
  sql:
    init:
      mode: always                              # 每次启动执行建表脚本（CREATE TABLE IF NOT EXISTS）
      schema-locations: classpath:sql/file.sql,classpath:sql/novel_extract.sql,classpath:sql/novel_crawl.sql,classpath:sql/novel_crawl_book.sql,classpath:sql/crawl_site_rule.sql,classpath:sql/crawl_saved_url.sql,classpath:sql/crawl_site_catalog.sql,classpath:sql/crawl_catalog_book.sql,classpath:sql/ai_model_config.sql,classpath:sql/python_env.sql,classpath:sql/material.sql
      encoding: UTF-8                           # Windows 下 JDK 17 默认 GBK，脚本按 UTF-8 读取
  servlet:
    multipart:
      max-file-size: 50MB        # 单文件大小上限
      max-request-size: 50MB     # 请求总大小上限

# 上传文件根目录（由 Spring Boot 管理，上传时自动创建缺失子目录），位于共享数据目录下
file:
  storage:
    path: ${app.data-dir}/upload

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 下划线列名 → 驼峰字段

# 共享数据目录（SQLite、上传文件、提取结果；Python 的生成小说也在此）。
# 留空则自动识别为 <项目根>/data（从 backend/ 或项目根启动都可）；可用环境变量 DATA_DIR 覆盖，Docker 中为 /data
# CORS 白名单：日常前端 5173，测试前端 5174
app:
  data-dir: ${DATA_DIR:}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174

# Python AI 服务（python-service，小说提取）
ai:
  service:
    url: http://localhost:8021     # 日常端口；测试用 --ai.service.url=http://localhost:8011
  # 默认模型（首次启动、模型配置表为空时自动写入并验证）。API Key 不写在这里：
  # 放在 backend/application-secret.yml（已 gitignore）的 ai.default.api-key，或环境变量 DEEPSEEK_API_KEY
  default:
    name: DeepSeek（默认）
    base-url: https://api.deepseek.com
    model: deepseek-chat
    api-key: ${DEEPSEEK_API_KEY:}

# Python 环境检测（由 Java 执行所选 python.exe，后端不依赖该 Python）
python-env:
  project-root:            # 留空自动识别（从 backend/ 或项目根启动均可）
  min-version: "3.10"
